name: Feature request
description: Suggest an improvement to the control-plane spec or hub docs
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest improvements that help integrators, security engineers, or agent-to-agent clients adopt the Kimss control plane.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for an integrator or security reviewer?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
