name: Bug report
description: Report a problem with the OpenAPI spec, examples, or documentation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include as much detail as possible.

  - type: input
    id: area
    attributes:
      label: Area
      description: Which part of the repo is affected?
      placeholder: openapi/control-plane.yaml, examples/, docs/anthropic-onboarding.md
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the error occurred?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message or mismatch
    validations:
      required: true
