<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Kimss control plane architecture">
  <title>Kimss Control Plane</title>
  <desc>Agents and SDKs enter the Kimss control plane through identity, policy, audit, metering, and kill switch, then reach vaulted providers and MCP infrastructure.</desc>

  <!-- Background -->
  <rect width="1280" height="560" rx="20" fill="#0c1220"/>
  <rect x="1" y="1" width="1278" height="558" rx="19" fill="none" stroke="#1e2a3f" stroke-width="2"/>

  <!-- Soft accent glow (no filters — GitHub-safe) -->
  <ellipse cx="640" cy="300" rx="420" ry="180" fill="#132038"/>

  <!-- Header -->
  <text x="640" y="48" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">KIMSS CONTROL PLANE</text>
  <text x="640" y="82" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Govern any agent before it reaches your models</text>
  <text x="640" y="112" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Dual-listener gateway  ·  OpenAPI contract  ·  A2A onboarding  ·  Article 12 audit</text>

  <!-- LEFT: Clients -->
  <rect x="48" y="148" width="280" height="340" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="188" y="180" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AGENTS &amp; SDKs</text>

  <rect x="72" y="200" width="232" height="48" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="188" y="230" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">OpenAI SDK</text>

  <rect x="72" y="260" width="232" height="48" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="188" y="290" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Anthropic SDK</text>

  <rect x="72" y="320" width="232" height="48" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="188" y="350" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Cascade / Cursor / A2A</text>

  <rect x="72" y="380" width="232" height="48" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="188" y="410" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Python &amp; Java clients</text>

  <text x="188" y="462" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">base_url ? api.kimss.ai</text>

  <!-- Arrow left ? center -->
  <line x1="338" y1="318" x2="392" y2="318" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="404,318 392,310 392,326" fill="#38bdf8"/>

  <!-- CENTER: Control plane -->
  <rect x="416" y="148" width="448" height="340" rx="16" fill="#0f1b2d" stroke="#38bdf8" stroke-width="2"/>
  <text x="640" y="180" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">GATEWAY SURFACE</text>
  <text x="640" y="208" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Identity · Policy · Audit</text>

  <!-- Five gate chips -->
  <rect x="444" y="232" width="118" height="44" rx="8" fill="#082f49" stroke="#0ea5e9"/>
  <text x="503" y="259" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Identity</text>

  <rect x="574" y="232" width="118" height="44" rx="8" fill="#082f49" stroke="#0ea5e9"/>
  <text x="633" y="259" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Policy</text>

  <rect x="704" y="232" width="136" height="44" rx="8" fill="#082f49" stroke="#0ea5e9"/>
  <text x="772" y="259" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Audit trail</text>

  <rect x="444" y="292" width="182" height="44" rx="8" fill="#082f49" stroke="#0ea5e9"/>
  <text x="535" y="319" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Metering</text>

  <rect x="642" y="292" width="198" height="44" rx="8" fill="#450a0a" stroke="#f87171"/>
  <text x="741" y="319" text-anchor="middle" fill="#fecaca" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Kill switch</text>

  <!-- Listeners strip -->
  <rect x="444" y="360" width="392" height="96" rx="12" fill="#0b1220" stroke="#334155"/>
  <text x="640" y="390" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">DUAL LISTENERS</text>
  <text x="640" y="418" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">POST /v1/chat/completions</text>
  <text x="640" y="440" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">POST /v1/messages</text>

  <!-- Arrow center ? right -->
  <line x1="874" y1="318" x2="928" y2="318" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="940,318 928,310 928,326" fill="#38bdf8"/>

  <!-- RIGHT: Your infra -->
  <rect x="952" y="148" width="280" height="340" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="1092" y="180" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">YOUR INFRASTRUCTURE</text>

  <rect x="976" y="200" width="232" height="48" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="1092" y="230" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Vaulted OpenAI</text>

  <rect x="976" y="260" width="232" height="48" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="1092" y="290" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Vaulted Anthropic</text>

  <rect x="976" y="320" width="232" height="48" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="1092" y="350" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Azure / custom models</text>

  <rect x="976" y="380" width="232" height="48" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="1092" y="410" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">MCP tool servers</text>

  <text x="1092" y="462" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">BYOI — you hold the keys</text>

  <!-- Footer -->
  <text x="640" y="530" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Live API: api.kimss.ai  ·  Spec: openapi/control-plane.yaml  ·  A2A: AI_INTEGRATION.md</text>
</svg>
