  <text x="780" y="288" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">MCP RBAC grants</text>
  <rect x="400" y="320" width="240" height="44" rx="12" fill="#1a0033" stroke="#8b5cf6"/>
  <text x="520" y="348" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Governed requests</text>
  <rect x="660" y="320" width="240" height="44" rx="12" fill="#1a0033" stroke="#8b5cf6"/>
  <text x="780" y="348" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Article 12 audit</text>
  <text x="640" y="420" text-anchor="middle" fill="#a5adc8" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Agent-to-agent integration without rewriting your data plane</text>

  <line x1="930" y1="310" x2="970" y2="310" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="970,310 958,304 958,316" fill="#8b5cf6"/>

  <rect x="980" y="170" width="220" height="280" rx="16" fill="#1c1140" stroke="#4b556f" stroke-width="2"/>
  <text x="1090" y="204" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">YOUR INFRA</text>
  <rect x="1004" y="250" width="172" height="40" rx="10" fill="#1a0033" stroke="#4b556f"/>
  <text x="1090" y="276" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">OpenAI / Anthropic</text>
  <rect x="1004" y="302" width="172" height="40" rx="10" fill="#1a0033" stroke="#4b556f"/>
  <text x="1090" y="328" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Azure / Foundry</text>
  <rect x="1004" y="354" width="172" height="40" rx="10" fill="#1a0033" stroke="#4b556f"/>
  <text x="1090" y="380" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Custom models</text>

  <text x="640" y="570" text-anchor="middle" fill="#6b7280" font-family="Segoe UI, system-ui, sans-serif" font-size="16">github.com/kimss-ai/kimss-control-plane</text>
