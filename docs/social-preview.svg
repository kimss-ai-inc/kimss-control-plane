  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <text x="640" y="72" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="700">KIMSS CONTROL PLANE</text>
  <text x="640" y="118" text-anchor="middle" fill="#a5adc8" font-family="Segoe UI, system-ui, sans-serif" font-size="20">Secure Enterprise Agent Gateway  ·  OpenAPI  ·  MCP RBAC  ·  A2A</text>

  <rect x="80" y="170" width="220" height="280" rx="16" fill="#1c1140" stroke="#4b556f" stroke-width="2"/>
