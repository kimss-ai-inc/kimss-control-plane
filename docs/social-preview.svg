  <rect x="104" y="230" width="172" height="40" rx="10" fill="#1a0033" stroke="#4b556f"/>
  <text x="190" y="256" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">OpenAI SDK</text>
  <rect x="104" y="282" width="172" height="40" rx="10" fill="#1a0033" stroke="#4b556f"/>
  <text x="190" y="308" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Anthropic SDK</text>
  <rect x="104" y="334" width="172" height="40" rx="10" fill="#1a0033" stroke="#4b556f"/>
  <text x="190" y="360" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">MCP clients</text>
  <rect x="104" y="386" width="172" height="40" rx="10" fill="#1a0033" stroke="#4b556f"/>
  <text x="190" y="412" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="14">Python / Java SDK</text>

  <line x1="310" y1="310" x2="350" y2="310" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="350,310 338,304 338,316" fill="#8b5cf6"/>

